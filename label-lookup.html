<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe6ea">
<title>ラベル照合</title>
<style>
  :root{
    --slip:#dfe6ea;
    --slip-deep:#c7d3da;
    --ink:#1d2b33;
    --ink-soft:#5b6f7a;
    --rule:#9fb2bd;
    --stamp:#b23a2e;
    --ok:#2c6650;
    --mono: ui-monospace,"SF Mono",Menlo,"Courier New",monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--slip);
    background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(159,178,189,.28) 27px 28px);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%;
    padding:0 14px calc(28px + env(safe-area-inset-bottom));
  }
  header{
    padding:22px 0 14px;
    display:flex;align-items:baseline;gap:10px;
    border-bottom:2px solid var(--ink);
  }
  h1{margin:0;font-size:19px;letter-spacing:.16em;font-weight:700}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-soft)}

  nav{display:flex;margin:0 0 18px;border-bottom:1px solid var(--rule)}
  nav button{
    flex:1;appearance:none;border:0;background:none;
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;
    color:var(--ink-soft);padding:13px 0;cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp)}
  nav button:focus-visible{outline:2px solid var(--stamp);outline-offset:-2px}

  .slip{
    background:#f4f8fa;
    border:1px solid var(--rule);
    padding:18px 16px 20px;
    position:relative;
    box-shadow:0 1px 0 var(--slip-deep);
  }
  .slip::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background-image:radial-gradient(circle,var(--rule) 1px,transparent 1px);
    background-size:7px 1px;
  }
  label, .flabel{
    display:block;font-family:var(--mono);font-size:13px;
    letter-spacing:.16em;color:var(--ink-soft);margin:0 0 6px;
  }
  input[type=text],input[type=search],textarea{
    width:100%;appearance:none;border:0;border-bottom:2px solid var(--ink);
    background:transparent;padding:6px 2px 8px;
    font-family:var(--mono);font-size:26px;letter-spacing:.14em;color:var(--ink);
    border-radius:0;
  }
  textarea{
    font-family:var(--sans);font-size:20px;letter-spacing:.02em;
    line-height:1.4;resize:none;overflow:hidden;display:block;
  }
  input:focus,textarea:focus{outline:0;border-bottom-color:var(--stamp)}
  .field{margin-bottom:20px}
  .field.small input{font-size:17px;letter-spacing:.06em}
  .pair{display:flex;gap:14px}
  .pair .field{flex:1}

  .btn{
    width:100%;appearance:none;border:2px solid var(--ink);background:var(--ink);
    color:#f4f8fa;font-family:var(--mono);font-size:14px;letter-spacing:.2em;
    padding:14px;cursor:pointer;border-radius:0;
  }
  .btn.ghost{background:transparent;color:var(--ink);margin-top:10px}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

  .result{margin-top:22px}
  .val{
    font-size:24px;color:var(--ink);line-height:1.35;
    padding:6px 2px 8px;border-bottom:2px solid var(--ink);
    min-height:46px;word-break:break-word;
  }
  .val.mono{font-family:var(--mono);font-weight:700;letter-spacing:.08em}
  .val.big{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.06em}
  .shot{
    width:100%;height:100%;object-fit:contain;display:block;
  }

  .stamp{
    position:absolute;top:10px;right:12px;
    border:3px double var(--stamp);color:var(--stamp);
    font-size:13px;font-weight:700;letter-spacing:.14em;
    padding:6px 10px;transform:rotate(-9deg);
    opacity:.9;pointer-events:none;
    animation:press .28s ease-out;
  }
  .stamp.miss{border-style:dashed}
  @keyframes press{from{transform:rotate(-9deg) scale(1.5);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.9}}
  @media (prefers-reduced-motion:reduce){.stamp{animation:none}}

  .empty{font-size:14px;line-height:1.9;color:var(--ink-soft);padding:26px 2px}
  .empty b{color:var(--ink)}

  .row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
  .row img{width:52px;height:52px;object-fit:cover;background:#fff;border:1px solid var(--rule);flex:none}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-size:15px;line-height:1.4;word-break:break-word}
  .row .t span{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em;display:block;word-break:break-word}
  .row button{
    appearance:none;border:1px solid var(--rule);background:none;color:var(--ink-soft);
    font-family:var(--mono);font-size:11px;padding:6px 8px;cursor:pointer;border-radius:0;flex:none;
  }

  .row button.danger{
    border-color:var(--stamp);color:#fff;background:var(--stamp);font-weight:700;
  }
  .shotpair{display:flex;gap:10px;margin-bottom:8px}
  .shotslot{flex:1}
  .preview{
    width:100%;aspect-ratio:3/4;border:1px dashed var(--rule);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-soft);
    overflow:hidden;
  }
  .preview img{width:100%;height:100%;object-fit:contain}
  .pick{display:block;text-align:center;margin-top:6px}
  .pick input{position:absolute;width:1px;height:1px;opacity:0}
  .pick .lbl{
    display:block;border:2px solid var(--ink);padding:9px 4px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer;
  }
  .pick input:focus-visible + .lbl{outline:2px solid var(--stamp);outline-offset:2px}
  .editing{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--stamp);
    margin-bottom:10px;
  }
  .toast{
    position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--ok);color:#fff;font-size:14px;padding:13px 15px;
    text-align:center;letter-spacing:.06em;z-index:9;
  }
  [hidden]{display:none !important}
</style>
</head>
<body>

<header>
  <h1>ラベル照合</h1>
  <span class="eyebrow">WINE / STOCK</span>
</header>

<nav role="tablist">
  <button role="tab" id="t-find" aria-selected="true">照会</button>
  <button role="tab" id="t-add" aria-selected="false">登録</button>
  <button role="tab" id="t-list" aria-selected="false">一覧</button>
</nav>

<!-- 照会 -->
<section id="v-find">
  <div class="slip">
    <div id="findStamp"></div>
    <div class="field">
      <label for="q">商品コード / JAN / 商品名</label>
      <input type="search" id="q" placeholder="コードを入力" autocomplete="off"
             autocapitalize="characters" enterkeyhint="search">
    </div>
    <button class="btn" id="go">照 会</button>
  </div>
  <div class="result" id="result"></div>
</section>

<!-- 登録 -->
<section id="v-add" hidden>
  <div class="editing" id="editing" hidden></div>
  <div class="shotpair">
    <div class="shotslot">
      <div class="preview" id="prev1">写真1 なし</div>
      <div class="pick">
        <input type="file" id="file1" accept="image/*" capture="environment">
        <label class="lbl" for="file1">写真1</label>
      </div>
    </div>
    <div class="shotslot">
      <div class="preview" id="prev2">写真2 なし</div>
      <div class="pick">
        <input type="file" id="file2" accept="image/*" capture="environment">
        <label class="lbl" for="file2">写真2</label>
      </div>
    </div>
  </div>

  <div class="slip" style="margin-top:16px">
    <div class="field small">
      <label for="a-code">商品コード（必須）</label>
      <input type="text" id="a-code" autocomplete="off" autocapitalize="characters">
    </div>
    <div class="field small">
      <label for="a-jan">JANコード</label>
      <input type="text" id="a-jan" inputmode="numeric" autocomplete="off">
    </div>
    <div class="field small">
      <label for="a-name">商品名</label>
      <textarea id="a-name" rows="1" autocomplete="off"></textarea>
    </div>
    <div class="field small">
      <label for="a-maker">メーカー名</label>
      <textarea id="a-maker" rows="1" autocomplete="off"></textarea>
    </div>
    <div class="pair">
      <div class="field small">
        <label for="a-shelf1">棚番1</label>
        <input type="text" id="a-shelf1" placeholder="B-3" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="field small">
        <label for="a-shelf2">棚番2</label>
        <input type="text" id="a-shelf2" placeholder="D-1" autocomplete="off" autocapitalize="characters">
      </div>
    </div>
    <button class="btn" id="save">保 存</button>
    <button class="btn ghost" id="clear">入力をクリア</button>
  </div>
</section>

<!-- 一覧 -->
<section id="v-list" hidden>
  <div id="rows"></div>
</section>

<script>
const $ = s => document.querySelector(s);
let db, blob1 = null, blob2 = null, urls = [];

function freeUrls(){ urls.forEach(URL.revokeObjectURL); urls = []; }
function objUrl(b){ const u = URL.createObjectURL(b); urls.push(u); return u; }
const norm = s => (s||'').trim().toUpperCase();
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 旧データ（image / shelf）も読めるようにする */
function img1(i){ return i.image1 || i.image || null; }
function img2(i){ return i.image2 || null; }
function sh1(i){ return i.shelf1 || i.shelf || ''; }
function sh2(i){ return i.shelf2 || ''; }

/* ---- storage ---- */
function open(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('label-lookup',1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('items')) d.createObjectStore('items',{keyPath:'code'});
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode){ return db.transaction('items',mode).objectStore('items'); }
function put(item){ return new Promise((res,rej)=>{ const r=tx('readwrite').put(item); r.onsuccess=res; r.onerror=()=>rej(r.error); }); }
function del(code){ return new Promise(res=>{ tx('readwrite').delete(code).onsuccess=res; }); }
function all(){ return new Promise(res=>{ const r=tx('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); }); }
function get(code){ return new Promise(res=>{ const r=tx('readonly').get(code); r.onsuccess=()=>res(r.result||null); }); }

/* ---- image shrink ---- */
async function shrink(file, max=1400){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*scale);
  c.height = Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  bmp.close && bmp.close();
  return new Promise(r => c.toBlob(r,'image/jpeg',0.82));
}

/* ---- textarea auto-grow ---- */
function grow(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
['#a-name','#a-maker'].forEach(s => {
  const el = $(s);
  el.addEventListener('input', () => grow(el));
});

/* ---- tabs ---- */
const views = {find:['#t-find','#v-find'], add:['#t-add','#v-add'], list:['#t-list','#v-list']};
function show(name){
  for(const [k,[tab,view]] of Object.entries(views)){
    $(tab).setAttribute('aria-selected', String(k===name));
    $(view).hidden = k!==name;
  }
  if(name==='list') renderList();
}
Object.keys(views).forEach(k => $(views[k][0]).onclick = () => show(k));

/* ---- find ---- */
async function find(){
  const q = norm($('#q').value);
  const stamp = $('#findStamp'), out = $('#result');
  stamp.innerHTML = ''; out.innerHTML = ''; freeUrls();
  if(!q) return;

  const items = await all();
  if(!items.length){
    out.innerHTML = '<p class="empty">まだ1件も登録がありません。<br><b>登録</b>タブで、ラベルの写真と商品コードを追加してください。</p>';
    return;
  }
  const exact = items.find(i => norm(i.code)===q || norm(i.jan)===q);
  const hits = exact ? [exact] : items.filter(i =>
    norm(i.code).includes(q) || norm(i.jan).includes(q) || norm(i.name).includes(q) || norm(i.maker).includes(q));

  if(!hits.length){
    stamp.innerHTML = '<span class="stamp miss">該当なし</span>';
    out.innerHTML = '<p class="empty">このコードは未登録です。<br><b>登録</b>タブから追加できます。</p>';
    return;
  }
  if(hits.length === 1){
    stamp.innerHTML = '<span class="stamp">照合済</span>';
    out.innerHTML = card(hits[0]);
  } else {
    out.innerHTML = '<p class="empty">' + hits.length + '件みつかりました。</p>' + hits.map(row).join('');
    bindRows();
  }
}
function card(i){
  const slot = (b, n) => '<div class="shotslot"><div class="preview">' +
    (b ? '<img class="shot" alt="写真' + n + '" src="' + objUrl(b) + '">' : '写真' + n + ' なし') +
    '</div></div>';
  const field = (lab, val, cls) =>
    '<div class="field"><span class="flabel">' + lab + '</span>' +
    '<div class="val ' + (cls || '') + '">' + (val ? esc(val) : '') + '</div></div>';

  return '<div class="shotpair">' + slot(img1(i), 1) + slot(img2(i), 2) + '</div>' +
    '<div class="slip" style="margin-top:16px">' +
      field('商品コード', i.code, 'mono') +
      field('JANコード', i.jan, 'mono') +
      field('商品名', i.name) +
      field('メーカー名', i.maker) +
      '<div class="pair">' +
        field('棚番1', sh1(i), 'big') +
        field('棚番2', sh2(i), 'big') +
      '</div>' +
    '</div>';
}
function row(i){
  const b = img1(i);
  const th = b ? '<img alt="" src="' + objUrl(b) + '">' : '<img alt="">';
  const shelves = [sh1(i), sh2(i)].filter(Boolean).join(' / ');
  return '<div class="row">' + th +
    '<div class="t"><b>' + esc(i.name || '（商品名なし）') + '</b>' +
    (i.maker ? '<span>' + esc(i.maker) + '</span>' : '') +
    '<span>' + esc(i.code) + (i.jan ? ' ・ ' + esc(i.jan) : '') + (shelves ? ' ・ ' + esc(shelves) : '') + '</span></div>' +
    '<button data-edit="' + esc(i.code) + '">編集</button>' +
    '<button data-del="' + esc(i.code) + '">削除</button></div>';
}

$('#go').onclick = find;
$('#q').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); find(); }});

/* ---- add / edit ---- */
$('#file1').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  blob1 = await shrink(f);
  $('#prev1').innerHTML = '<img alt="写真1" src="' + objUrl(blob1) + '">';
};
$('#file2').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  blob2 = await shrink(f);
  $('#prev2').innerHTML = '<img alt="写真2" src="' + objUrl(blob2) + '">';
};

function resetForm(){
  blob1 = blob2 = null;
  $('#prev1').textContent = '写真1 なし';
  $('#prev2').textContent = '写真2 なし';
  ['#a-code','#a-jan','#a-name','#a-maker','#a-shelf1','#a-shelf2'].forEach(s => $(s).value = '');
  $('#file1').value = ''; $('#file2').value = '';
  grow($('#a-name')); grow($('#a-maker'));
  $('#editing').hidden = true;
}
$('#clear').onclick = resetForm;

$('#save').onclick = async () => {
  const code = $('#a-code').value.trim();
  if(!code){ toast('商品コードを入力してください'); $('#a-code').focus(); return; }
  await put({
    code,
    jan: $('#a-jan').value.trim(),
    name: $('#a-name').value.trim(),
    maker: $('#a-maker').value.trim(),
    shelf1: $('#a-shelf1').value.trim(),
    shelf2: $('#a-shelf2').value.trim(),
    image1: blob1,
    image2: blob2
  });
  toast(code + ' を保存しました');
  resetForm();
};

async function loadForEdit(code){
  const i = await get(code);
  if(!i){ toast('見つかりません'); return; }
  blob1 = img1(i); blob2 = img2(i);
  $('#prev1').innerHTML = blob1 ? '<img alt="写真1" src="' + objUrl(blob1) + '">' : '写真1 なし';
  $('#prev2').innerHTML = blob2 ? '<img alt="写真2" src="' + objUrl(blob2) + '">' : '写真2 なし';
  $('#a-code').value = i.code;
  $('#a-jan').value = i.jan || '';
  $('#a-name').value = i.name || '';
  $('#a-maker').value = i.maker || '';
  $('#a-shelf1').value = sh1(i);
  $('#a-shelf2').value = sh2(i);
  grow($('#a-name')); grow($('#a-maker'));
  $('#editing').textContent = '編集中：' + i.code;
  $('#editing').hidden = false;
  show('add');
  window.scrollTo(0,0);
}

/* ---- list ---- */
async function renderList(){
  freeUrls();
  const items = (await all()).sort((a,b) => a.code.localeCompare(b.code));
  $('#rows').innerHTML = items.length
    ? items.map(row).join('')
    : '<p class="empty">まだ1件も登録がありません。<br><b>登録</b>タブから追加してください。</p>';
  bindRows();
}
function bindRows(){
  document.querySelectorAll('[data-del]').forEach(b => {
    let armed = false, t;
    b.onclick = async () => {
      if(!armed){
        armed = true;
        b.textContent = '本当に削除？';
        b.classList.add('danger');
        t = setTimeout(() => {
          armed = false;
          b.textContent = '削除';
          b.classList.remove('danger');
        }, 5000);
        return;
      }
      clearTimeout(t);
      await del(b.dataset.del);
      toast('削除しました');
      renderList();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => loadForEdit(b.dataset.edit));
}

/* ---- toast ---- */
let tId;
function toast(msg){
  clearTimeout(tId);
  let el = $('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  tId = setTimeout(() => el.remove(), 2200);
}

/* ---- アプリに戻ったら登録フォームを白紙に戻す ---- */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') resetForm();
});
window.addEventListener('pageshow', () => resetForm());

/* ---- boot ---- */
open().then(d => { db = d; }).catch(() => {
  document.body.innerHTML = '<p class="empty" style="padding:40px 14px">この画面ではデータを保存できません。公開したURLからアクセスしてください。</p>';
});
</script>
</body>
</html>
